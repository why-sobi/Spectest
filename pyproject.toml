[project]
name = "spectest"
version = "0.1.0"
description = "Spec-driven pytest generation and regression tracking agent"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "openai>=1.40",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "watchdog>=4.0",
]

[project.scripts]
spectest = "spectest.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spectest", "spectest.tools"]
